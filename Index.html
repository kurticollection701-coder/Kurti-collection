<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Dress</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222;
}

.cover{
  width:100%;
  height:300px;
  background:#ddd;
  position:relative;
  overflow:hidden;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.profile{
  background:white;
  text-align:center;
  padding:0 15px 28px;
}

.profile img{
  width:125px;
  height:125px;
  margin-top:-62px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid white;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
  background:#eee;
}

.profile h1{
  margin:10px 0 5px;
  font-size:28px;
}

.profile p{
  margin:0 auto;
  color:#666;
  max-width:700px;
  line-height:1.5;
}

.collection{
  max-width:1200px;
  margin:auto;
  padding:30px 15px;
}

.collection h2{
  text-align:center;
  margin:0 0 8px;
  font-size:28px;
}

.collection-subtitle{
  text-align:center;
  color:#666;
  margin:0 0 25px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.gallery{
  height:370px;
  position:relative;
  background:#eee;
  overflow:hidden;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  cursor:zoom-in;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:white;
  font-size:28px;
  z-index:3;
}

.prev{left:10px}
.next{right:10px}

.counter{
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 10px;
  background:rgba(0,0,0,.65);
  color:white;
  border-radius:20px;
  font-size:13px;
  z-index:3;
}

.info{
  padding:18px;
}

.name{
  margin:0 0 8px;
  font-size:20px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:7px;
}

.fabric{
  color:#555;
  margin-bottom:10px;
}

.description{
  color:#666;
  line-height:1.5;
}

.order{
  display:block;
  margin-top:15px;
  padding:13px;
  background:#111;
  color:white;
  text-decoration:none;
  text-align:center;
  border-radius:10px;
  font-weight:bold;
}

#error{
  display:none;
  max-width:900px;
  margin:20px auto;
  padding:15px;
  background:#ffe5e5;
  border:1px solid #d99;
  border-radius:10px;
  color:#900;
}

/* VIEWER */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.96);
  z-index:99999;
  align-items:center;
  justify-content:center;
}

.viewer.active{
  display:flex;
}

.viewer img{
  max-width:88%;
  max-height:78%;
  object-fit:contain;
  transition:.2s;
}

.close{
  position:absolute;
  top:10px;
  right:15px;
  color:white;
  font-size:40px;
  background:none;
  border:0;
}

.viewer-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:50px;
  height:50px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:white;
  font-size:30px;
}

.viewer-prev{left:15px}
.viewer-next{right:15px}

.zoom{
  position:absolute;
  bottom:20px;
  display:flex;
  gap:8px;
}

.zoom button{
  min-width:48px;
  height:42px;
  border:0;
  border-radius:8px;
  font-size:18px;
}

@media(max-width:600px){

  .cover{height:220px}

  .profile img{
    width:105px;
    height:105px;
    margin-top:-52px;
  }

  .profile h1{font-size:24px}

  .collection h2{font-size:24px}

  .gallery{height:330px}
}
</style>
</head>

<body>

<section class="cover">
  <img id="coverImage" alt="Fancy Dress Cover">
</section>

<section class="profile">

  <img id="profileImage" alt="Fancy Dress">

  <h1 id="brand">Fancy Dress</h1>

  <p id="intro">
    Stylish Cotton Kurtis • Beautiful Designs • Easy WhatsApp Ordering
  </p>

</section>

<section class="collection">

  <h2 id="title">
    Fancy Kurti Collection
  </h2>

  <p id="subtitle" class="collection-subtitle">
    Explore our latest Cotton Kurti designs and order your favorite style on WhatsApp.
  </p>

  <div id="error"></div>

  <div id="products" class="products"></div>

</section>


<!-- FULL SCREEN IMAGE VIEWER -->

<div id="viewer" class="viewer">

  <button class="close" onclick="closeViewer()">×</button>

  <button
    class="viewer-arrow viewer-prev"
    onclick="viewerPrev(event)">
    ‹
  </button>

  <img id="viewerImage" alt="Product Image">

  <button
    class="viewer-arrow viewer-next"
    onclick="viewerNext(event)">
    ›
  </button>

  <div class="zoom">

    <button onclick="zoomOut(event)">−</button>

    <button onclick="resetZoom(event)">Reset</button>

    <button onclick="zoomIn(event)">+</button>

  </div>

</div>


<script src="data.js?v=20260920"></script>

<script>

(function(){

  try{

    if(
      !window.STORE_DATA ||
      !Array.isArray(window.STORE_DATA.products)
    ){
      throw new Error(
        "Store data could not be loaded."
      );
    }


    const data =
      window.STORE_DATA;


    document.getElementById("brand").textContent =
      data.brand || "Fancy Dress";

    document.getElementById("title").textContent =
      data.title || "Fancy Kurti Collection";

    document.getElementById("intro").textContent =
      data.subtitle ||
      "Stylish Cotton Kurtis • Beautiful Designs • Easy WhatsApp Ordering";

    document.getElementById("subtitle").textContent =
      data.subtitle ||
      "Explore our latest Cotton Kurti designs and order your favorite style on WhatsApp.";


    const cover =
      document.getElementById("coverImage");

    cover.src =
      data.coverImage || "";

    cover.onerror =
      function(){
        this.style.display="none";
      };


    const profile =
      document.getElementById("profileImage");

    profile.src =
      data.profileImage || "";

    profile.onerror =
      function(){
        this.style.display="none";
      };


    const container =
      document.getElementById("products");


    const products =
      data.products;


    products.forEach(function(product,index){

      let images =
        Array.isArray(product.images)
          ? product.images.filter(Boolean)
          : [];


      if(
        images.length === 0 &&
        product.image
      ){
        images = [product.image];
      }


      if(images.length === 0){
        return;
      }


      const card =
        document.createElement("article");

      card.className =
        "product";


      const gallery =
        document.createElement("div");

      gallery.className =
        "gallery";


      const photo =
        document.createElement("img");

      photo.src =
        images[0];

      photo.alt =
        product.name ||
        "Fancy Kurti Design";


      let current =
        0;


      const counter =
        document.createElement("div");

      counter.className =
        "counter";

      counter.textContent =
        "1 / " + images.length;


      gallery.appendChild(photo);


      if(images.length > 1){

        const previous =
          document.createElement("button");

        previous.className =
          "arrow prev";

        previous.textContent =
          "‹";


        const next =
          document.createElement("button");

        next.className =
          "arrow next";

        next.textContent =
          "›";


        previous.onclick =
          function(e){

            e.stopPropagation();

            current--;

            if(current < 0){
              current =
                images.length - 1;
            }

            photo.src =
              images[current];

            counter.textContent =
              (current + 1) +
              " / " +
              images.length;
          };


        next.onclick =
          function(e){

            e.stopPropagation();

            current++;

            if(current >= images.length){
              current = 0;
            }

            photo.src =
              images[current];

            counter.textContent =
              (current + 1) +
              " / " +
              images.length;
          };


        gallery.appendChild(previous);
        gallery.appendChild(next);
        gallery.appendChild(counter);

      }


      photo.onclick =
        function(){

          openViewer(
            images,
            current
          );

        };


      photo.onerror =
        function(){

          this.style.display =
            "none";

        };


      const info =
        document.createElement("div");

      info.className =
        "info";


      const name =
        product.name ||
        "Fancy Kurti Design " +
        String(index + 1).padStart(2,"0");


      const price =
        product.price || "560";


      const fabric =
        product.fabric || "Cotton";


      const description =
        product.description ||
        "Beautiful Cotton Kurti with an elegant design and comfortable fit.";


      const nameEl =
        document.createElement("h3");

      nameEl.className =
        "name";

      nameEl.textContent =
        name;


      const priceEl =
        document.createElement("div");

      priceEl.className =
        "price";

      priceEl.textContent =
        "₹" + price;


      const fabricEl =
        document.createElement("div");

      fabricEl.className =
        "fabric";

      fabricEl.textContent =
        "Fabric: " + fabric;


      const descriptionEl =
        document.createElement("div");

      descriptionEl.className =
        "description";

      descriptionEl.textContent =
        description;


      const order =
        document.createElement("a");

      order.className =
        "order";

      order.target =
        "_blank";


      const message =
        "Hello, I want to order " +
        name +
        ". Price: ₹" +
        price +
        ". Fabric: " +
        fabric +
        ".";


      order.href =
        "https://wa.me/" +
        String(data.whatsapp).replace(/\D/g,"") +
        "?text=" +
        encodeURIComponent(message);


      order.textContent =
        "Order on WhatsApp";


      info.appendChild(nameEl);
      info.appendChild(priceEl);
      info.appendChild(fabricEl);
      info.appendChild(descriptionEl);
      info.appendChild(order);


      card.appendChild(gallery);
      card.appendChild(info);

      container.appendChild(card);

    });


  }catch(error){

    const box =
      document.getElementById("error");

    box.textContent =
      "Website data loading error: " +
      error.message;

    box.style.display =
      "block";

  }

})();


/* VIEWER */

let viewerImages = [];
let viewerIndex = 0;
let zoom = 1;


function openViewer(images,index){

  viewerImages =
    images;

  viewerIndex =
    index;

  zoom = 1;

  document
    .getElementById("viewer")
    .classList.add("active");

  showViewerImage();

}


function showViewerImage(){

  const img =
    document.getElementById("viewerImage");

  if(!viewerImages.length){
    return;
  }

  img.src =
    viewerImages[viewerIndex];

  img.style.transform =
    "scale(" + zoom + ")";

}


function viewerPrev(event){

  event.stopPropagation();

  if(!viewerImages.length){
    return;
  }

  viewerIndex--;

  if(viewerIndex < 0){
    viewerIndex =
      viewerImages.length - 1;
  }

  zoom = 1;

  showViewerImage();

}


function viewerNext(event){

  event.stopPropagation();

  if(!viewerImages.length){
    return;
  }

  viewerIndex++;

  if(
    viewerIndex >=
    viewerImages.length
  ){
    viewerIndex = 0;
  }

  zoom = 1;

  showViewerImage();

}


function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("active");

  zoom = 1;

}


function zoomIn(event){

  event.stopPropagation();

  zoom += .25;

  if(zoom > 3){
    zoom = 3;
  }

  showViewerImage();

}


function zoomOut(event){

  event.stopPropagation();

  zoom -= .25;

  if(zoom < .5){
    zoom = .5;
  }

  showViewerImage();

}


function resetZoom(event){

  event.stopPropagation();

  zoom = 1;

  showViewerImage();

}

</script>

</body>
  </html>
