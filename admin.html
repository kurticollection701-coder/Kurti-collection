<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Fancy Dress Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:18px;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:18px;
}

.panel{
  background:white;
  padding:18px;
  border-radius:15px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

h1,h2{
  margin-top:0;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:9px;
  background:#111;
  color:white;
  font-weight:bold;
  margin-top:12px;
}

.add{
  background:#087f23;
}

.delete{
  background:#d22;
}

.product{
  border:1px solid #ddd;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
}

.small{
  color:#666;
  font-size:13px;
}

.message{
  padding:12px;
  border-radius:9px;
  margin-top:12px;
  display:none;
}

.success{
  background:#e5f7e8;
  border:1px solid #9bd0a3;
}

.error{
  background:#ffe5e5;
  border:1px solid #d99;
}

</style>

</head>

<body>

<div class="wrap">

<div class="header">

<h1>Fancy Dress Admin</h1>

<p>
Manage your store and products.
</p>

</div>


<div class="panel">

<h2>Store Settings</h2>


<label>Store Name</label>

<input
  id="brand"
  value="Fancy Dress"
>


<label>Collection Title</label>

<input
  id="title"
  value="Fancy Kurti Collection"
>


<label>Website Description</label>

<textarea id="subtitle">Explore our latest Cotton Kurti designs and order your favorite style on WhatsApp.</textarea>


<label>WhatsApp Number</label>

<input
  id="whatsapp"
  value="919119392297"
>


<label>Cover Image URL</label>

<input
  id="cover"
  value="https://raw.githubusercontent.com/kurticollection701-coder/Kurti-collection/main/file_000000002880820ba259f14d92660b69.png"
>


<label>Profile Image URL</label>

<input
  id="profile"
  value="https://raw.githubusercontent.com/kurticollection701-coder/Kurti-collection/main/23caf061f0ed205725b8495c7b94f6ab.jpg"
>

</div>


<div class="panel">

<h2>Products</h2>

<div id="products"></div>

<button
  class="add"
  onclick="addProduct()"
>
+ Add New Product
</button>

</div>


<div class="panel">

<h2>Save</h2>

<p>
After making changes, download the new
<b>data.js</b> and replace the old
<b>data.js</b> file in GitHub.
</p>

<button onclick="downloadData()">
Download data.js
</button>

<div
  id="success"
  class="message success">
</div>

<div
  id="error"
  class="message error">
</div>

</div>

</div>


<script>

let data = {

  brand:"Fancy Dress",

  title:"Fancy Kurti Collection",

  subtitle:
    "Explore our latest Cotton Kurti designs and order your favorite style on WhatsApp.",

  whatsapp:"919119392297",

  cover:
    "https://raw.githubusercontent.com/kurticollection701-coder/Kurti-collection/main/file_000000002880820ba259f14d92660b69.png",

  profile:
    "https://raw.githubusercontent.com/kurticollection701-coder/Kurti-collection/main/23caf061f0ed205725b8495c7b94f6ab.jpg",

  products:[]

};


function loadData(){

  if(
    window.STORE_DATA
  ){

    const old =
      window.STORE_DATA;

    data.brand =
      old.brand || data.brand;

    data.title =
      old.title || data.title;

    data.subtitle =
      old.subtitle || data.subtitle;

    data.whatsapp =
      old.whatsapp || data.whatsapp;

    data.cover =
      old.coverImage || data.cover;

    data.profile =
      old.profileImage || data.profile;

    data.products =
      Array.isArray(old.products)
        ? JSON.parse(
            JSON.stringify(old.products)
          )
        : [];

  }


  document.getElementById("brand").value =
    data.brand;

  document.getElementById("title").value =
    data.title;

  document.getElementById("subtitle").value =
    data.subtitle;

  document.getElementById("whatsapp").value =
    data.whatsapp;

  document.getElementById("cover").value =
    data.cover;

  document.getElementById("profile").value =
    data.profile;

  render();

}


function render(){

  const box =
    document.getElementById("products");

  box.innerHTML="";


  data.products.forEach(
    function(product,index){

      if(!Array.isArray(product.images)){

        product.images =
          product.image
            ? [product.image]
            : [];

      }


      while(product.images.length < 5){
        product.images.push("");
      }


      const div =
        document.createElement("div");

      div.className =
        "product";


      div.innerHTML = `

<h3>
${escapeHTML(
  product.name ||
  "Fancy Kurti Design " +
  String(index+1).padStart(2,"0")
)}
</h3>

<label>Product Name</label>

<input
value="${escapeAttr(
  product.name ||
  "Fancy Kurti Design " +
  String(index+1).padStart(2,"0")
)}"
oninput="changeProduct(${index},'name',this.value)"
>


<label>Price</label>

<input
value="${escapeAttr(
  product.price || "560"
)}"
oninput="changeProduct(${index},'price',this.value)"
>


<label>Fabric</label>

<input
value="${escapeAttr(
  product.fabric || "Cotton"
)}"
oninput="changeProduct(${index},'fabric',this.value)"
>


<label>Description</label>

<textarea
oninput="changeProduct(${index},'description',this.value)"
>${escapeHTML(
  product.description || ""
)}</textarea>


<label>Image 1</label>

<input
value="${escapeAttr(
  product.images[0] || ""
)}"
oninput="changeImage(${index},0,this.value)"
>


<label>Image 2</label>

<input
value="${escapeAttr(
  product.images[1] || ""
)}"
oninput="changeImage(${index},1,this.value)"
>


<label>Image 3</label>

<input
value="${escapeAttr(
  product.images[2] || ""
)}"
oninput="changeImage(${index},2,this.value)"
>


<label>Image 4</label>

<input
value="${escapeAttr(
  product.images[3] || ""
)}"
oninput="changeImage(${index},3,this.value)"
>


<label>Image 5</label>

<input
value="${escapeAttr(
  product.images[4] || ""
)}"
oninput="changeImage(${index},4,this.value)"
>


<button
class="delete"
onclick="deleteProduct(${index})"
>
Delete Product
</button>

`;

      box.appendChild(div);

    }
  );

}


function changeProduct(
  index,
  field,
  value
){

  data.products[index][field] =
    value;

}


function changeImage(
  index,
  imageIndex,
  value
){

  if(
    !Array.isArray(
      data.products[index].images
    )
  ){
    data.products[index].images=[];
  }

  data.products[index].images[imageIndex] =
    value;

  data.products[index].image =
    data.products[index].images[0];

}


function addProduct(){

  const number =
    data.products.length + 1;


  data.products.push({

    name:
      "Fancy Kurti Design " +
      String(number).padStart(2,"0"),

    price:"560",

    fabric:"Cotton",

    images:[""],

    description:
      "Beautiful Cotton Kurti with an elegant design and comfortable fit. Perfect for everyday wear and special occasions."

  });


  render();

}


function deleteProduct(index){

  if(
    confirm(
      "Delete this product?"
    )
  ){

    data.products.splice(
      index,
      1
    );

    render();

  }

}


function downloadData(){

  try{

    data.brand =
      document.getElementById("brand").value.trim();

    data.title =
      document.getElementById("title").value.trim();

    data.subtitle =
      document.getElementById("subtitle").value.trim();

    data.whatsapp =
      document
        .getElementById("whatsapp")
        .value
        .replace(/\D/g,"");

    data.cover =
      document.getElementById("cover").value.trim();

    data.profile =
      document.getElementById("profile").value.trim();


    const finalData = {

      brand:data.brand,

      title:data.title,

      subtitle:data.subtitle,

      whatsapp:data.whatsapp,

      coverImage:data.cover,

      profileImage:data.profile,

      products:data.products.map(
        function(product){

          return {

            name:
              product.name ||
              "Fancy Kurti Design",

            price:
              product.price || "560",

            fabric:
              product.fabric || "Cotton",

            images:
              (product.images || [])
                .filter(Boolean),

            description:
              product.description || ""

          };

        }
      )

    };


    const code =
      "window.STORE_DATA = " +
      JSON.stringify(
        finalData,
        null,
        2
      ) +
      ";";


    const blob =
      new Blob(
        [code],
        {
          type:
            "application/javascript"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");

    link.href=url;

    link.download="data.js";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);


    showSuccess(
      "data.js downloaded successfully."
    );

  }catch(error){

    showError(
      "Could not create data.js: " +
      error.message
    );

  }

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return escapeHTML(value);

}


function showSuccess(message){

  const box =
    document.getElementById("success");

  box.textContent =
    message;

  box.style.display =
    "block";

}


function showError(message){

  const box =
    document.getElementById("error");

  box.textContent =
    message;

  box.style.display =
    "block";

}


const script =
  document.createElement("script");

script.src =
  "data.js?v=" +
  Date.now();

script.onload =
  function(){

    loadData();

  };

script.onerror =
  function(){

    showError(
      "data.js could not be loaded."
    );

    render();

  };

document.body.appendChild(script);

</script>

</body>
 </html>
