<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}.wrap{max-width:850px;margin:auto;padding:20px}.panel{background:#fff;padding:20px;border-radius:14px;margin-bottom:15px}input,textarea{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ddd;border-radius:8px}button{background:#111;color:#fff;border:0;padding:11px 15px;border-radius:8px;cursor:pointer}.hidden{display:none}.item{padding:12px 0;border-top:1px solid #eee}</style></head><body><div class="wrap"><h1>Kurti Collection Admin</h1><div id="login" class="panel"><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="error"></p></div><div id="app" class="hidden"><div class="panel"><h2>Store Settings</h2><input id="brand" placeholder="Store name"><input id="title" placeholder="Heading"><input id="subtitle" placeholder="Subtitle"><input id="whatsapp" placeholder="WhatsApp number, e.g. 919119392297"><button onclick="save()">Save & Download data.js</button></div><div class="panel"><h2>Product जोड़ें</h2><input id="name" placeholder="Product name"><input id="price" placeholder="Price"><input id="image" placeholder="Image URL"><textarea id="description" placeholder="Description"></textarea><button onclick="add()">Add Product</button></div><div class="panel"><h2>Products</h2><div id="list"></div></div></div></div><script src="data.js"></script><script>let d=JSON.parse(JSON.stringify(STORE_DATA));function login(){if(email.value.trim()==='kurticollection701@gmail.com'&&password.value==='Pooja@@2'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');fill()}else error.textContent='Login details गलत हैं'}function fill(){brand.value=d.brand;title.value=d.title;subtitle.value=d.subtitle;whatsapp.value=d.whatsapp;render()}function save(){d.brand=brand.value;d.title=title.value;d.subtitle=subtitle.value;d.whatsapp=whatsapp.value.replace(/\D/g,'');download()}function add(){d.products.push({name:name.value,price:price.value,image:image.value,description:description.value});name.value=price.value=image.value=description.value='';render();download()}function render(){list.innerHTML=d.products.map((p,i)=>'<div class="item"><b>'+p.name+'</b> — ₹'+p.price+' <button onclick="d.products.splice('+i+',1);render();download()">Delete</button></div>').join('')}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['const STORE_DATA='+JSON.stringify(d)+';'],{type:'application/javascript'}));a.download='data.js';a.click()}</script></body></html>
