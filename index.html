<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fancy Dress</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222;
}

/* COVER */
.cover{
  width:100%;
  height:280px;
  background:#ddd center/cover no-repeat;
}

/* PROFILE */
.profile-area{
  background:#fff;
  text-align:center;
  padding:0 15px 25px;
}

.profile-photo{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #fff;
  margin-top:-62px;
  background:#eee;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.store-name{
  margin:10px 0 6px;
  font-size:28px;
}

.store-intro{
  margin:0 auto;
  color:#666;
  max-width:700px;
  line-height:1.5;
}

/* COLLECTION */
.collection{
  max-width:1200px;
  margin:auto;
  padding:30px 15px;
}

.collection-title{
  text-align:center;
  margin:0 0 8px;
  font-size:28px;
}

.collection-subtitle{
  text-align:center;
  color:#666;
  margin:0 0 25px;
}

/* PRODUCTS */
.posts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.post{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.gallery{
  position:relative;
  height:360px;
  background:#eee;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:zoom-in;
}

.arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:25px;
  z-index:2;
}

.arrow.left{
  left:10px;
}

.arrow.right{
  right:10px;
}

.photo-count{
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:13px;
}

.product-info{
  padding:18px;
}

.product-name{
  margin:0 0 8px;
  font-size:20px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

.fabric{
  color:#555;
  margin-bottom:10px;
}

.description{
  color:#666;
  line-height:1.5;
}

.order-btn{
  display:block;
  width:100%;
  margin-top:15px;
  padding:13px;
  background:#111;
  color:#fff;
  text-align:center;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

/* VIEWER */
.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.95);
  align-items:center;
  justify-content:center;
}

.viewer.active{
  display:flex;
}

.viewer-image{
  max-width:90%;
  max-height:82%;
  object-fit:contain;
  transition:transform .2s ease;
}

.close-viewer{
  position:absolute;
  top:15px;
  right:20px;
  border:0;
  background:none;
  color:#fff;
  font-size:38px;
}

.viewer-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:#fff;
  font-size:28px;
}

.viewer-left{
  left:15px;
}

.viewer-right{
  right:15px;
}

.zoom-controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}

.zoom-controls button{
  height:42px;
  min-width:48px;
  border:0;
  border-radius:8px;
  font-size:18px;
}

/* MOBILE */
@media(max-width:600px){

  .cover{
    height:220px;
  }

  .profile-photo{
    width:105px;
    height:105px;
    margin-top:-52px;
  }

  .store-name{
    font-size:24px;
  }

  .collection-title{
    font-size:24px;
  }

  .gallery{
    height:330px;
  }
}
</style>
</head>

<body>

<section class="cover" id="cover"></section>

<section class="profile-area">

<img
  id="profilePhoto"
  class="profile-photo"
  alt="Fancy Dress">

<h1
  id="storeName"
  class="store-name">
  Fancy Dress
</h1>

<p class="store-intro">
Stylish Cotton Kurtis • Beautiful Designs • Easy WhatsApp Ordering
</p>

</section>

<section class="collection">

<h2 class="collection-title">
Fancy Kurti Collection
</h2>

<p class="collection-subtitle">
Explore our latest designs and order your favorite style on WhatsApp.
</p>

<div
  id="posts"
  class="posts">
</div>

</section>

<div
  id="viewer"
  class="viewer">

<button
  class="close-viewer"
  onclick="closeViewer()">
×
</button>

<button
  class="viewer-arrow viewer-left"
  onclick="viewerPrevious()">
‹
</button>

<img
  id="viewerImage"
  class="viewer-image"
  alt="Product Image">

<button
  class="viewer-arrow viewer-right"
  onclick="viewerNext()">
›
</button>

<div class="zoom-controls">

<button onclick="zoomOut()">−</button>

<button onclick="resetZoom()">Reset</button>

<button onclick="zoomIn()">+</button>

</div>

</div>

<script src="data.js"></script>

<script>

/* IMAGE URL */

const RAW_BASE =
"https://raw.githubusercontent.com/kurticollection701-coder/Kurti-collection/main/";

function imageURL(image){

  if(!image){
    return "";
  }

  if(
    image.startsWith("http://") ||
    image.startsWith("https://")
  ){
    return image;
  }

  return RAW_BASE + image;
}


/* STORE INFORMATION */

if(typeof STORE_DATA !== "undefined"){

  if(STORE_DATA.coverImage){
    document.getElementById("cover").style.backgroundImage =
      "url('" + imageURL(STORE_DATA.coverImage) + "')";
  }

  if(STORE_DATA.profileImage){
    document.getElementById("profilePhoto").src =
      imageURL(STORE_DATA.profileImage);
  }

  if(STORE_DATA.brand){
    document.getElementById("storeName").textContent =
      STORE_DATA.brand;
  }

}


/* PRODUCTS */

const posts =
document.getElementById("posts");

const products =
(typeof STORE_DATA !== "undefined" &&
 Array.isArray(STORE_DATA.products))
 ? STORE_DATA.products
 : [];


let viewerImages = [];
let viewerIndex = 0;
let zoomLevel = 1;


products.forEach(function(product,index){

  let images = [];

  if(Array.isArray(product.images)){
    images = product.images;
  }
  else if(product.image){
    images = [product.image];
  }

  if(images.length === 0){
    return;
  }


  const post =
  document.createElement("div");

  post.className = "post";


  const gallery =
  document.createElement("div");

  gallery.className = "gallery";


  const image =
  document.createElement("img");

  image.src =
    imageURL(images[0]);

  image.alt =
    product.name ||
    "Fancy Kurti Design " + (index + 1);


  image.onclick =
    function(){
      openViewer(images,0);
    };


  gallery.appendChild(image);


  if(images.length > 1){

    const left =
    document.createElement("button");

    left.className =
      "arrow left";

    left.textContent = "‹";

    left.onclick =
      function(){
        changeGalleryImage(
          image,
          images,
          -1
        );
      };


    const right =
    document.createElement("button");

    right.className =
      "arrow right";

    right.textContent = "›";

    right.onclick =
      function(){
        changeGalleryImage(
          image,
          images,
          1
        );
      };


    const count =
    document.createElement("div");

    count.className =
      "photo-count";

    count.textContent =
      "1 / " + images.length;


    gallery.appendChild(left);
    gallery.appendChild(right);
    gallery.appendChild(count);


    image.dataset.photoIndex = "0";

  }


  const info =
  document.createElement("div");

  info.className =
    "product-info";


  const name =
  document.createElement("h3");

  name.className =
    "product-name";

  name.textContent =
    product.name ||
    "Fancy Kurti Design " + String(index + 1).padStart(2,"0");


  const price =
  document.createElement("div");

  price.className =
    "price";

  price.textContent =
    "₹560";


  const fabric =
  document.createElement("div");

  fabric.className =
    "fabric";

  fabric.textContent =
    "Fabric: Cotton";


  const description =
  document.createElement("div");

  description.className =
    "description";

  description.textContent =
    product.description ||
    "Beautiful cotton kurti with an elegant design and comfortable fit. Perfect for everyday wear and special occasions.";


  const button =
  document.createElement("a");

  button.className =
    "order-btn";

  const whatsapp =
    (typeof STORE_DATA !== "undefined" &&
     STORE_DATA.whatsapp)
    ? STORE_DATA.whatsapp
    : "919119392297";


  const message =
    "Hello, I want to order " +
    (name.textContent) +
    ". Price: ₹560. Fabric: Cotton.";


  button.href =
    "https://wa.me/" +
    whatsapp +
    "?text=" +
    encodeURIComponent(message);

  button.target =
    "_blank";

  button.textContent =
    "Order on WhatsApp";


  info.appendChild(name);
  info.appendChild(price);
  info.appendChild(fabric);
  info.appendChild(description);
  info.appendChild(button);


  post.appendChild(gallery);
  post.appendChild(info);

  posts.appendChild(post);

});


/* GALLERY */

function changeGalleryImage(
  image,
  images,
  direction
){

  let current =
    parseInt(image.dataset.photoIndex || "0");

  current += direction;

  if(current < 0){
    current = images.length - 1;
  }

  if(current >= images.length){
    current = 0;
  }

  image.src =
    imageURL(images[current]);

  image.dataset.photoIndex =
    current;

  const count =
    image.parentElement.querySelector(".photo-count");

  if(count){
    count.textContent =
      (current + 1) +
      " / " +
      images.length;
  }

}


/* VIEWER */

function openViewer(
  images,
  index
){

  viewerImages =
    images;

  viewerIndex =
    index;

  zoomLevel =
    1;

  document
    .getElementById("viewer")
    .classList.add("active");

  showViewerImage();

}


function showViewerImage(){

  const viewerImage =
    document.getElementById("viewerImage");

  viewerImage.src =
    imageURL(
      viewerImages[viewerIndex]
    );

  viewerImage.style.transform =
    "scale(" + zoomLevel + ")";
}


function viewerPrevious(){

  if(viewerImages.length === 0){
    return;
  }

  viewerIndex--;

  if(viewerIndex < 0){
    viewerIndex =
      viewerImages.length - 1;
  }

  zoomLevel = 1;

  showViewerImage();
}


function viewerNext(){

  if(viewerImages.length === 0){
    return;
  }

  viewerIndex++;

  if(viewerIndex >= viewerImages.length){
    viewerIndex = 0;
  }

  zoomLevel = 1;

  showViewerImage();
}


function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("active");

}


function zoomIn(){

  zoomLevel += .25;

  if(zoomLevel > 3){
    zoomLevel = 3;
  }

  showViewerImage();

}


function zoomOut(){

  zoomLevel -= .25;

  if(zoomLevel < .5){
    zoomLevel = .5;
  }

  showViewerImage();

}


function resetZoom(){

  zoomLevel = 1;

  showViewerImage();

}


/* CLOSE VIEWER BY CLICKING BACKGROUND */

document
  .getElementById("viewer")
  .addEventListener(
    "click",
    function(event){

      if(event.target === this){
        closeViewer();
      }

    }
  );

</script>

</body>
</html>
