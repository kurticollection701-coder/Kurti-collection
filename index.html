<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Shopping</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222;
}

/* COVER */
.cover{
  position:relative;
  width:100%;
  height:280px;
  background:#ddd;
  background-size:cover;
  background-position:center;
}

.cover-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.05),
    rgba(0,0,0,0.45)
  );
}

/* PROFILE */
.profile-area{
  background:white;
  position:relative;
  padding:0 20px 25px;
  text-align:center;
}

.profile-photo{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid white;
  margin-top:-62px;
  position:relative;
  background:white;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.store-name{
  margin:10px 0 5px;
  font-size:28px;
  font-weight:bold;
}

.store-intro{
  margin:0 auto;
  max-width:650px;
  color:#666;
  line-height:1.5;
}

/* COLLECTION */
.collection{
  max-width:1250px;
  margin:auto;
  padding:30px 15px;
}

.collection-title{
  text-align:center;
  font-size:28px;
  margin:0 0 8px;
}

.collection-subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

/* POSTS */
.posts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.post{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.10);
}

.gallery{
  position:relative;
  width:100%;
  height:350px;
  background:#eee;
  overflow:hidden;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:zoom-in;
}

.gallery-button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  color:white;
  font-size:22px;
  cursor:pointer;
}

.gallery-button.prev{
  left:10px;
}

.gallery-button.next{
  right:10px;
}

.photo-count{
  position:absolute;
  right:10px;
  top:10px;
  background:rgba(0,0,0,.6);
  color:white;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.post-info{
  padding:18px;
}

.post-info h3{
  margin:0 0 8px;
  font-size:20px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

.fabric{
  font-size:14px;
  color:#555;
  margin-bottom:10px;
}

.description{
  color:#666;
  line-height:1.5;
  min-height:45px;
}

.order-btn{
  display:block;
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
}

/* FULLSCREEN IMAGE */
.viewer{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.94);
  align-items:center;
  justify-content:center;
}

.viewer.active{
  display:flex;
}

.viewer img{
  max-width:95%;
  max-height:90%;
  object-fit:contain;
  cursor:zoom-in;
  transition:transform .2s ease;
}

.close-viewer{
  position:absolute;
  top:15px;
  right:20px;
  color:white;
  font-size:35px;
  background:none;
  border:0;
  cursor:pointer;
}

.zoom-controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}

.zoom-controls button{
  width:48px;
  height:42px;
  border:0;
  border-radius:8px;
  font-size:22px;
  cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){

  .cover{
    height:220px;
  }

  .profile-photo{
    width:105px;
    height:105px;
    margin-top:-52px;
  }

  .store-name{
    font-size:24px;
  }

  .collection-title{
    font-size:24px;
  }

  .gallery{
    height:330px;
  }

}
</style>
</head>

<body>

<!-- COVER PHOTO -->
<section class="cover" id="cover">
  <div class="cover-overlay"></div>
</section>

<!-- PROFILE -->
<section class="profile-area">

  <img
    id="profilePhoto"
    class="profile-photo"
    src=""
    alt="Online Shopping"
  >

  <h1 class="store-name" id="storeName">
    Online Shopping
  </h1>

  <p class="store-intro">
    Stylish Cotton Kurtis • Beautiful Designs • Easy WhatsApp Ordering
  </p>

</section>


<!-- COLLECTION -->
<section class="collection">

  <h2 class="collection-title">
    Fancy Kurti Collection
  </h2>

  <p class="collection-subtitle">
    Explore our latest designs and order your favorite style on WhatsApp.
  </p>

  <div class="posts" id="posts"></div>

</section>


<!-- FULLSCREEN IMAGE VIEWER -->
<div class="viewer" id="viewer">

  <button class="close-viewer" onclick="closeViewer()">
    ×
  </button>

  <img id="viewerImage" src="" alt="Product Image">

  <div class="zoom-controls">
    <button onclick="zoomOut()">−</button>
    <button onclick="resetZoom()">Reset</button>
    <button onclick="zoomIn()">+</button>
  </div>

</div>


<script src="data.js"></script>

<script>

/*
  COVER AND PROFILE IMAGE

  These can be set later in data.js:
  
  coverImage: "your-cover-image.jpg"
  profileImage: "your-profile-image.jpg"
*/

const coverImage =
  STORE_DATA.coverImage || "";

const profileImage =
  STORE_DATA.profileImage || "";


/* STORE NAME */

document.getElementById("storeName").textContent =
  STORE_DATA.brand || "Online Shopping";


/* COVER PHOTO */

if(coverImage){
  document.getElementById("cover").style.backgroundImage =
    "url('" + coverImage.replace(/'/g,"\\'") + "')";
}


/* PROFILE PHOTO */

if(profileImage){
  document.getElementById("profilePhoto").src =
    profileImage;
}


/* PRODUCTS */

const postsBox = document.getElementById("posts");

const products = STORE_DATA.products || [];


/*
  Each product can contain:

  images: [
    "photo1.jpg",
    "photo2.jpg",
    "photo3.jpg",
    "photo4.jpg",
    "photo5.jpg"
  ]

  If only "image" exists, it will also work.
*/


products.forEach((product,index)=>{

  let productImages = [];

  if(Array.isArray(product.images)){
    productImages = product.images;
  }

  else if(product.image){
    productImages = [product.image];
  }

  if(productImages.length === 0){
    return;
  }


  const post = document.createElement("article");

  post.className = "post";


  const gallery = document.createElement("div");

  gallery.className = "gallery";


  const image = document.createElement("img");

  image.src = productImages[0];

  image.alt =
    product.name || "Fancy Kurti Design";


  image.onclick = function(){
    openViewer(productImages,0);
  };


  gallery.appendChild(image);


  /* PHOTO COUNT */

  if(productImages.length > 1){

    const count = document.createElement("div");

    count.className = "photo-count";

    count.textContent =
      "1 / " + productImages.length;

    gallery.appendChild(count);


    /* PREVIOUS */

    const previous =
      document.createElement("button");

    previous.className =
      "gallery-button prev";

    previous.innerHTML = "‹";

    /* NEXT */

    const next =
      document.createElement("button");

    next.className =
      "gallery-button next";

    next.innerHTML = "›";


    let currentImage = 0;


    function showImage(){

      image.src =
        productImages[currentImage];

      count.textContent =
        (currentImage + 1) +
        " / " +
        productImages.length;
    }


    previous.onclick = function(event){

      event.stopPropagation();

      currentImage--;

      if(currentImage < 0){
        currentImage =
          productImages.length - 1;
      }

      showImage();
    };


    next.onclick = function(event){

      event.stopPropagation();

      currentImage++;

      if(currentImage >= productImages.length){
        currentImage = 0;
      }

      showImage();
    };


    gallery.appendChild(previous);
    gallery.appendChild(next);

  }


  /* PRODUCT INFORMATION */

  const info =
    document.createElement("div");

  info.className = "post-info";


  const name =
    product.name ||
    "Fancy Kurti Design " +
    String(index + 1).padStart(2,"0");


  const price =
    product.price || "560";


  const description =
    product.description ||
    "Elegant Cotton Kurti with a stylish design. Comfortable for everyday and special occasions.";


  info.innerHTML = `

    <h3>${name}</h3>

    <div class="price">
      ₹${price}
    </div>

    <div class="fabric">
      Fabric: Cotton
    </div>

    <div class="description">
      ${description}
    </div>

  `;


  /* WHATSAPP */

  const orderButton =
    document.createElement("a");

  orderButton.className =
    "order-btn";

  orderButton.target =
    "_blank";


  const message =
    "Hello, I want to order " +
    name +
    ". Price: ₹" +
    price +
    ". Fabric: Cotton.";


  orderButton.href =
    "https://wa.me/" +
    STORE_DATA.whatsapp +
    "?text=" +
    encodeURIComponent(message);


  orderButton.textContent =
    "Order on WhatsApp";


  info.appendChild(orderButton);


  post.appendChild(gallery);

  post.appendChild(info);

  postsBox.appendChild(post);

});


/* IMAGE VIEWER */

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");


let viewerImages = [];

let viewerIndex = 0;

let zoomLevel = 1;


function openViewer(images,index){

  viewerImages = images;

  viewerIndex = index;

  zoomLevel = 1;

  viewerImage.src =
    viewerImages[viewerIndex];

  viewerImage.style.transform =
    "scale(1)";

  viewer.classList.add("active");
}


function closeViewer(){

  viewer.classList.remove("active");

  zoomLevel = 1;

}


function zoomIn(){

  zoomLevel += .25;

  if(zoomLevel > 3){
    zoomLevel = 3;
  }

  viewerImage.style.transform =
    "scale(" + zoomLevel + ")";
}


function zoomOut(){

  zoomLevel -= .25;

  if(zoomLevel < .5){
    zoomLevel = .5;
  }

  viewerImage.style.transform
