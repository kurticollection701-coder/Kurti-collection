<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kurti Collection</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f7;color:#222}header{background:#111;color:#fff;padding:16px 5%;display:flex;justify-content:space-between}.hero{text-align:center;background:#fff;padding:30px}.grid{max-width:1200px;margin:auto;padding:24px 5%;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px #0001}.card img{width:100%;height:280px;object-fit:cover}.info{padding:15px}.price{font-size:20px;font-weight:bold}.btn{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;padding:12px;border-radius:9px;margin-top:12px}</style></head><body><header><b id="brand">Kurti Collection</b><a href="admin.html" style="color:white">Admin</a></header><section class="hero"><h1 id="title">नई कलेक्शन</h1><p id="sub">अपनी पसंद का कपड़ा चुनें और WhatsApp पर ऑर्डर करें</p></section><main id="products" class="grid"></main><script src="data.js"></script><script>let d=STORE_DATA;brand.textContent=d.brand;title.textContent=d.title;sub.textContent=d.subtitle;let box=document.getElementById('products');(d.products||[]).forEach(p=>{let c=document.createElement('article');c.className='card';c.innerHTML='<img src="'+p.image+'" alt=""><div class="info"><h3>'+p.name+'</h3><div class="price">₹'+p.price+'</div><p>'+p.description+'</p><a class="btn" target="_blank" href="https://wa.me/'+d.whatsapp+'?text='+encodeURIComponent('नमस्ते, मुझे यह प्रोडक्ट ऑर्डर करना है: '+p.name+' | कीमत: ₹'+p.price)+'">WhatsApp पर Order करें</a></div>';box.appendChild(c)})</script></body></html>
