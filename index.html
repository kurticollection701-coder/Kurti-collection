<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Fancy Dress</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222;
}

/* COVER */

.cover{
  width:100%;
  height:280px;
  background:#ddd center/cover no-repeat;
}

/* PROFILE */

.profile-area{
  background:#fff;
  text-align:center;
  padding:0 15px 25px;
}

.profile-photo{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid #fff;
  margin-top:-62px;
  background:#eee;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.store-name{
  margin:10px 0 6px;
  font-size:28px;
}

.store-intro{
  margin:0 auto;
  color:#666;
  max-width:700px;
  line-height:1.5;
}

/* COLLECTION */

.collection{
  max-width:1200px;
  margin:auto;
  padding:30px 15px;
}

.collection-title{
  text-align:center;
  margin:0 0 8px;
  font-size:28px;
}

.collection-subtitle{
  text-align:center;
  color:#666;
  margin:0 0 25px;
}

/* PRODUCTS */

.posts{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.post{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.12);
}

.gallery{
  position:relative;
  height:360px;
  background:#eee;
  overflow:hidden;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:zoom-in;
}

.gallery-button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:28px;
  cursor:pointer;
  z-index:2;
}

.gallery-button.prev{
  left:10px;
}

.gallery-button.next{
  right:10px;
}

.photo-count{
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 10px;
  border-radius:20px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:13px;
  z-index:2;
}

.product-info{
  padding:18px;
}

.product-name{
  margin:0 0 8px;
  font-size:20px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

.fabric{
  color:#555;
  margin-bottom:10px;
}

.description{
  color:#666;
  line-height:1.5;
  min-height:45px;
}

.order-btn{
  display:block;
  width:100%;
  margin-top:15px;
  padding:13px;
  background:#111;
  color:#fff;
  text-align:center;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

/* FULLSCREEN VIEWER */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,.95);
  align-items:center;
  justify-content:center;
}

.viewer.active{
  display:flex;
}

.viewer-image{
  max-width:88%;
  max-height:78%;
  object-fit:contain;
  transition:transform .2s ease;
}

.close-viewer{
  position:absolute;
  top:12px;
  right:18px;
  border:0;
  background:none;
  color:#fff;
  font-size:40px;
  cursor:pointer;
  z-index:5;
}

.viewer-button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  color:#fff;
  font-size:30px;
  cursor:pointer;
  z-index:5;
}

.viewer-prev{
  left:15px;
}

.viewer-next{
  right:15px;
}

.zoom-controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:5;
}

.zoom-controls button{
  min-width:48px;
  height:42px;
  border:0;
  border-radius:8px;
  font-size:18px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:600px){

  .cover{
    height:220px;
  }

  .profile-photo{
    width:105px;
    height:105px;
    margin-top:-52px;
  }

  .store-name{
    font-size:24px;
  }

  .collection-title{
    font-size:24px;
  }

  .gallery{
    height:330px;
  }

}

</style>

</head>

<body>

<!-- COVER -->

<section
  class="cover"
  id="cover">
</section>


<!-- PROFILE -->

<section class="profile-area">

<img
  id="profilePhoto"
  class="profile-photo"
  alt="Fancy Dress"
>

<h1
  id="storeName"
  class="store-name">
  Fancy Dress
</h1>

<p class="store-intro">
  Stylish Cotton Kurtis • Beautiful Designs • Easy WhatsApp Ordering
</p>

</section>


<!-- COLLECTION -->

<section class="collection">

<h2
  id="collectionTitle"
  class="collection-title">
  Fancy Kurti Collection
</h2>

<p
  id="collectionSubtitle"
  class="collection-subtitle">
  Explore our latest designs and order your favorite style on WhatsApp.
</p>

<div
  id="posts"
  class="posts">
</div>

</section>


<!-- FULLSCREEN VIEWER -->

<div
  id="viewer"
  class="viewer">

<button
  class="close-viewer"
  onclick="closeViewer()">
  ×
</button>

<button
  class="viewer-button viewer-prev"
  onclick="viewerPrevious(event)">
  ‹
</button>

<img
  id="viewerImage"
  class="viewer-image"
  alt="Product Image"
>

<button
  class="viewer-button viewer-next"
  onclick="viewerNext(event)">
  ›
</button>

<div class="zoom-controls">

<button onclick="zoomOut(event)">
  −
</button>

<button onclick="resetZoom(event)">
  Reset
</button>

<button onclick="zoomIn(event)">
  +
</button>

</div>

</div>


<!-- DATA -->

<script src="data.js?v=20260920"></script>


<script>

/* STORE */

document.getElementById("storeName").textContent =
  STORE_DATA.brand;

document.getElementById("collectionTitle").textContent =
  STORE_DATA.title;

document.getElementById("collectionSubtitle").textContent =
  STORE_DATA.subtitle;


/* COVER */

document.getElementById("cover").style.backgroundImage =
  "url('" + STORE_DATA.coverImage + "')";


/* PROFILE */

document.getElementById("profilePhoto").src =
  STORE_DATA.profileImage;


/* PRODUCTS */

const posts =
  document.getElementById("posts");

const products =
  Array.isArray(STORE_DATA.products)
    ? STORE_DATA.products
    : [];


let viewerImages = [];

let viewerIndex = 0;

let zoomLevel = 1;


/* CREATE PRODUCTS */

products.forEach(function(product,index){

  if(
    !Array.isArray(product.images) ||
    product.images.length === 0
  ){
    return;
  }


  const post =
    document.createElement("article");

  post.className = "post";


  /* GALLERY */

  const gallery =
    document.createElement("div");

  gallery.className = "gallery";


  const image =
    document.createElement("img");

  image.src =
    product.images[0];

  image.alt =
    product.name ||
    "Fancy Kurti Design " +
    String(index + 1).padStart(2,"0");


  let currentImage = 0;


  /* IMAGE CLICK */

  image.onclick =
    function(){

      openViewer(
        product.images,
        currentImage
      );

    };


  gallery.appendChild(image);


  /* MULTIPLE IMAGES */

  if(product.images.length > 1){

    const count =
      document.createElement("div");

    count.className =
      "photo-count";

    count.textContent =
      "1 / " +
      product.images.length;


    const previous =
      document.createElement("button");

    previous.className =
      "gallery-button prev";

    previous.textContent =
      "‹";


    const next =
      document.createElement("button");

    next.className =
      "gallery-button next";

    next.textContent =
      "›";


    previous.onclick =
      function(event){

        event.stopPropagation();

        currentImage--;

        if(currentImage < 0){
          currentImage =
            product.images.length - 1;
        }

        image.src =
          product.images[currentImage];

        count.textContent =
          (currentImage + 1) +
          " / " +
          product.images.length;

      };


    next.onclick =
      function(event){

        event.stopPropagation();

        currentImage++;

        if(
          currentImage >=
          product.images.length
        ){
          currentImage = 0;
        }

        image.src =
          product.images[currentImage];

        count.textContent =
          (currentImage + 1) +
          " / " +
          product.images.length;

      };


    gallery.appendChild(previous);

    gallery.appendChild(next);

    gallery.appendChild(count);

  }


  /* PRODUCT INFORMATION */

  const info =
    document.createElement("div");

  info.className =
    "product-info";


  const name =
    product.name ||
    "Fancy Kurti Design " +
    String(index + 1).padStart(2,"0");


  const price =
    product.price || "560";


  const fabric =
    product.fabric || "Cotton";


  const description =
    product.description ||
    "Beautiful Cotton Kurti with an elegant design and comfortable fit. Perfect for everyday wear and special occasions.";


  const nameElement =
    document.createElement("h3");

  nameElement.className =
    "product-name";

  nameElement.textContent =
    name;


  const priceElement =
    document.createElement("div");

  priceElement.className =
    "price";

  priceElement.textContent =
    "₹" + price;


  const fabricElement =
    document.createElement("div");

  fabricElement.className =
    "fabric";

  fabricElement.textContent =
    "Fabric: " + fabric;


  const descriptionElement =
    document.createElement("div");

  descriptionElement.className =
    "description";

  descriptionElement.textContent =
    description;


  /* WHATSAPP */

  const orderButton =
    document.createElement("a");

  orderButton.className =
    "order-btn";

  orderButton.target =
    "_blank";

  const message =
    "Hello, I want to order " +
    name +
    ". Price: ₹" +
    price +
    ". Fabric: " +
    fabric +
    ".";


  orderButton.href =
    "https://wa.me/" +
    STORE_DATA.whatsapp +
    "?text=" +
    encodeURIComponent(message);


  orderButton.textContent =
    "Order on WhatsApp";


  info.appendChild(nameElement);

  info.appendChild(priceElement);

  info.appendChild(fabricElement);

  info.appendChild(descriptionElement);

  info.appendChild(orderButton);


  post.appendChild(gallery);

  post.appendChild(info);

  posts.appendChild(post);

});


/* VIEWER */

const viewer =
  document.getElementById("viewer");

const viewerImage =
  document.getElementById("viewerImage");


function openViewer(images,index){

  viewerImages =
    images;

  viewerIndex =
    index;

  zoomLevel =
    1;

  showViewerImage();

  viewer.classList.add("active");

}


function showViewerImage(){

  if(viewerImages.length === 0){
    return;
  }

  viewerImage.src =
    viewerImages[viewerIndex];

  viewerImage.style.transform =
    "scale(" + zoomLevel + ")";

}


/* PREVIOUS */

function viewerPrevious(event){

  event.stopPropagation();

  if(viewerImages.length === 0){
    return;
  }

  viewerIndex--;

  if(viewerIndex < 0){
    viewerIndex =
      viewerImages.length - 1;
  }

  zoomLevel = 1;

  showViewerImage();

}


/* NEXT */

function viewerNext(event){

  event.stopPropagation();

  if(viewerImages.length === 0){
    return;
  }

  viewerIndex++;

  if(
    viewerIndex >=
    viewerImages.length
  ){
    viewerIndex = 0;
  }

  zoomLevel = 1;

  showViewerImage();

}


/* CLOSE */

function closeViewer(){

  viewer.classList.remove("active");

  zoomLevel = 1;

  viewerImage.style.transform =
    "scale(1)";

}


/* ZOOM IN */

function zoomIn(event){

  event.stopPropagation();

  zoomLevel += .25;

  if(zoomLevel > 3){
    zoomLevel = 3;
  }

  showViewerImage();

}


/* ZOOM OUT */

function zoomOut(event){

  event.stopPropagation();

  zoomLevel -= .25;

  if(zoomLevel < .5){
    zoomLevel = .5;
  }

  showViewerImage();

}


/* RESET */

function resetZoom(event){

  event.stopPropagation();

  zoomLevel = 1;

  showViewerImage();

}


/* CLOSE BY BACKGROUND */

viewer.addEventListener(
  "click",
  function(event){

    if(event.target === viewer){
      closeViewer();
    }

  }
);

</script>

</body>
  </html>
