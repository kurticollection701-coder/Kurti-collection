<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fancy Dress</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f3f3;
  color:#222;
}

/* COVER */
.cover{
  width:100%;
  height:280px;
  background:#ddd center/cover no-repeat;
}

/* PROFILE */
.profile-area{
  background:#fff;
  text-align:center;
  padding:0 20px 25px;
}

.profile-photo{
  width:125px;
  height:125px;
  border-radius:50%;
  object-fit:cover;
  border:5px solid white;
  margin-top:-62px;
  background:white;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.store-name{
  margin:10px 0 5px;
  font-size:28px;
  font-weight:bold;
}

.store-intro{
  margin:0 auto;
  max-width:650px;
  color:#666;
  line-height:1.5;
}

/* COLLECTION */
.collection{
  max-width:1250px;
  margin:auto;
  padding:30px 15px;
}

.collection-title{
  text-align:center;
  font-size:28px;
  margin:0 0 8px;
}

.collection-subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

/* PRODUCTS */
.posts{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

.post{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.10);
}

.gallery{
  position:relative;
  width:100%;
  height:350px;
  background:#eee;
  overflow:hidden;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  cursor:zoom-in;
}

.gallery-button{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:white;
  font-size:25px;
}

.gallery-button.prev{
  left:10px;
}

.gallery-button.next{
  right:10px;
}

.photo-count{
  position:absolute;
  right:10px;
  top:10px;
  background:rgba(0,0,0,.65);
  color:white;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.post-info{
  padding:18px;
}

.post-info h3{
  margin:0 0 8px;
  font-size:20px;
}

.price{
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

.fabric{
  font-size:14px;
  color:#555;
  margin-bottom:10px;
}

.description{
  color:#666;
  line-height:1.5;
  min-height:45px;
}

.order-btn{
  display:block;
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:bold;
}

/* IMAGE VIEWER */
.viewer{
  display:none;
  position:fixed;
  z-index:9999;
  inset:0;
  background:rgba(0,0,0,.94);
  align-items:center;
  justify-content:center;
}

.viewer.active{
  display:flex;
}

.viewer img{
  max-width:95%;
  max-height:85%;
  object-fit:contain;
  transition:transform .2s ease;
}

.close-viewer{
  position:absolute;
  top:15px;
  right:20px;
  color:white;
  font-size:35px;
  background:none;
  border:0;
}

.zoom-controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:10px;
}

.zoom-controls button{
  min-width:48px;
  height:42px;
  border:0;
  border-radius:8px;
  font-size:20px;
}

/* MOBILE */
@media(max-width:600px){

  .cover{
    height:220px;
  }

  .profile-photo{
    width:105px;
    height:105px;
    margin-top:-52px;
  }

  .store-name{
    font-size:24px;
  }

  .collection-title{
    font-size:24px;
  }

  .gallery{
    height:330px;
  }
}
</style>
</head>

<body>

<!-- COVER PHOTO -->
<section
  class="cover"
  id="cover">
</section>

<!-- PROFILE -->
<section class="profile-area">

  <img
    id="profilePhoto"
    class="profile-photo"
    alt="Fancy Dress"
  >

  <h1
    class="store-name"
    id="storeName">
    Fancy Dress
  </h1>

  <p class="store-intro">
    Stylish Cotton Kurtis • Beautiful Designs • Easy WhatsApp Ordering
  </p>

</
