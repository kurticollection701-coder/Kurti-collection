<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Unlimited Store - Kurtis and kids clothing at the best quality and best price.">
<title>Unlimited Store</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#171717;font-family:Arial,Helvetica,sans-serif}
.cover{height:300px;background:#ddd center/cover no-repeat;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.28))}
.profileRow{position:absolute;z-index:2;left:28px;bottom:-72px;display:flex;align-items:end;gap:16px}.profile{width:145px;height:145px;border-radius:50%;border:5px solid #fff;background:center/cover no-repeat;box-shadow:0 5px 20px #0004}
.brand{background:#fff;border-radius:12px;padding:10px 16px;font-size:26px;font-weight:800;box-shadow:0 3px 12px #0002}
.bio{max-width:1120px;margin:92px auto 20px;background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 2px 12px #0001;line-height:1.55}
.toolbar{max-width:1120px;margin:0 auto 18px;padding:0 10px}.search{width:100%;padding:13px 15px;border:1px solid #ddd;border-radius:11px;font-size:16px}
.grid{max-width:1120px;margin:auto;padding:0 10px 45px;display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 12px #0001}.main{width:100%;height:285px;display:block;object-fit:cover;cursor:zoom-in;background:#eee}
.thumbs{display:flex;gap:6px;padding:8px;overflow:auto}.thumbs img{width:55px;height:55px;object-fit:cover;border-radius:7px;border:2px solid transparent;cursor:pointer}.thumbs img.active{border-color:#25d366}
.info{padding:14px}.price{font-size:20px;font-weight:800;margin-bottom:6px}.desc{white-space:pre-line;min-height:78px;line-height:1.45}
.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}.order{background:#25d366;color:#fff}.secondary{background:#eef0f2;color:#222}
.empty{text-align:center;padding:55px;grid-column:1/-1}.modal{display:none;position:fixed;z-index:20;inset:0;background:#000d;align-items:center;justify-content:center;padding:20px}.modal img{max-width:96vw;max-height:92vh;object-fit:contain}.close{position:fixed;right:22px;top:12px;color:#fff;font-size:42px;cursor:pointer}
.notice{font-size:13px;color:#666;margin-top:8px}
@media(max-width:600px){.cover{height:230px}.profile{width:105px;height:105px}.profileRow{left:12px;bottom:-52px}.brand{font-size:19px}.bio{margin-top:68px;border-radius:0}.main{height:260px}}
</style>
</head>
<body>
<header class="cover" id="cover">
  <div class="profileRow"><div class="profile" id="profile"></div><div class="brand">Unlimited Store</div></div>
</header>

<section class="bio" id="bio"></section>
<div class="toolbar"><input id="search" class="search" placeholder="Search products..."></div>
<main id="grid" class="grid"></main>

<div id="modal" class="modal" onclick="closeModal()">
  <span class="close">×</span><img id="modalImg" alt="Product preview">
</div>

<script src="data.js"></script>
<script>
const S=window.STORE_DATA||{settings:{},products:[]};
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function nl(v){return esc(v).replace(/\\n/g,"<br>");}
$("cover").style.backgroundImage=`url("${S.settings.coverPhoto||""}")`;
$("profile").style.backgroundImage=`url("${S.settings.profilePhoto||""}")`;
$("bio").innerHTML=`<strong>Unlimited Store</strong><p>${nl(S.settings.bio||"")}</p><div class="notice">No location access is requested by this website.</div>`;

let products=[...(S.products||[])];
try{
 const likes=JSON.parse(localStorage.getItem("us_likes")||"{}");
 products.forEach(p=>p.likes=likes[p.id]??p.likes??0);
}catch(e){}

function render(){
 const q=$("search").value.toLowerCase().trim();
 const list=products.filter(p=>(p.name+" "+p.description+" "+p.id).toLowerCase().includes(q));
 $("grid").innerHTML=list.length?list.map(card).join(""):'<div class="empty">No products found.</div>';
}
function card(p){
 const imgs=(p.images||[]).filter(Boolean).slice(0,4),first=imgs[0]||"";
 return `<article class="card" id="product-${esc(p.id)}">
  <img class="main" src="${first}" alt="${esc(p.name)}" onclick="zoom(this.src)">
  <div class="thumbs">${imgs.map((x,i)=>`<img src="${x}" class="${i===0?'active':''}" alt="Product view ${i+1}" onclick="changeMain(this)">`).join("")}</div>
  <div class="info">
   <div class="price">Price ₹${Number(p.price||S.settings.price||560).toLocaleString("en-IN")}</div>
   <div>Fiber Cotton</div>
   <div>All size available ✅</div>
   <p class="desc">${esc(p.description||"Beautiful design with quality finishing.")}</p>
   <div class="actions">
    <button class="btn order" onclick="orderProduct('${esc(p.id)}')">Order Now</button>
    <button class="btn secondary" onclick="likeProduct('${esc(p.id)}',this)">♡ Like <span>${p.likes||0}</span></button>
    <button class="btn secondary" onclick="shareProduct('${esc(p.id)}')">Share</button>
    <button class="btn secondary" onclick="downloadProduct('${first}','${esc(p.name||p.id)}')">Download</button>
   </div>
  </div>
 </article>`;
}
function changeMain(el){
 const c=el.closest(".card");c.querySelector(".main").src=el.src;
 c.querySelectorAll(".thumbs img").forEach(x=>x.classList.remove("active"));el.classList.add("active");
}
function zoom(src){$("modalImg").src=src;$("modal").style.display="flex"}
function closeModal(){$("modal").style.display="none"}
function orderProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const image=(p.images||[])[0]||"";
 const publicImage=image.startsWith("http")?image:"";
 const msg=`Hello Unlimited Store, I want to order this product.
Product No.: ${p.id}
Product: ${p.name}
Price: ₹${p.price||S.settings.price||560}
Product photo: ${publicImage||"Please see product No. "+p.id+" on the website."}`;
 window.location.href=`https://wa.me/${S.settings.whatsapp}?text=${encodeURIComponent(msg)}`;
}
function likeProduct(id,btn){
 const p=products.find(x=>x.id===id);if(!p)return;p.likes=(p.likes||0)+1;
 btn.querySelector("span").textContent=p.likes;
 try{const m=JSON.parse(localStorage.getItem("us_likes")||"{}");m[id]=p.likes;localStorage.setItem("us_likes",JSON.stringify(m));}catch(e){}
}
async function shareProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 const url=location.href.split("#")[0]+"#product-"+encodeURIComponent(p.id);
 const text=`${p.name} - ₹${p.price||S.settings.price||560}\nProduct No.: ${p.id}`;
 if(navigator.share){try{await navigator.share({title:p.name,text,url});}catch(e){}}
 else{try{await navigator.clipboard.writeText(text+"\n"+url);alert("Product details copied.");}catch(e){alert("Sharing is not supported on this browser.");}}
}
function downloadProduct(src,name){
 if(!src){alert("No product image is available.");return}
 const a=document.createElement("a");a.href=src;a.download=(name||"product").replace(/[^a-z0-9_-]/gi,"_")+".jpg";
 document.body.appendChild(a);a.click();a.remove();
}
$("search").addEventListener("input",render);render();
</script>
</body>
</html>
